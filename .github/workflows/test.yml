name: Validate parser and archive

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: catalog_test
          POSTGRES_PASSWORD: catalog_test
          POSTGRES_DB: catalog_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U catalog_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://catalog_test:catalog_test@127.0.0.1:5432/catalog_test
      TEST_DATABASE_URL: postgresql://catalog_test:catalog_test@127.0.0.1:5432/catalog_test
      API_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Python tests, including Postgres concurrency
        run: python -m unittest discover -s tests
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Web tests and lint
        working-directory: apps/web
        run: |
          npm test
          npm run lint
      - name: Build against an isolated local API
        run: |
          python -m uvicorn apps.api.main:app --host 127.0.0.1 --port 8000 > /tmp/tictacgo-api.log 2>&1 &
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/health
          npm run build --prefix apps/web
