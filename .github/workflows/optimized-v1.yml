name: Publish optimized daily solutions

on:
  schedule:
    # UTC; avoid the busy top of the hour. Catch up after missed runs.
    - cron: '17 * * * *'
  workflow_dispatch:

# This job publishes only the dedicated data branch; no cloud/DB secrets needed.
permissions:
  contents: write

concurrency:
  group: optimized-v1-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out solver
        uses: actions/checkout@v4
        with:
          path: source
      - name: Check out existing publication and its authentication
        uses: actions/checkout@v4
        with:
          ref: optimized-v1-data
          path: state/publication
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: source/requirements-optimized-worker.txt
      - name: Install solver runtime
        run: python -m pip install -r source/requirements-optimized-worker.txt
      - name: Verify a real fresh-board solve and independent replay
        working-directory: source
        env:
          PYTHONPATH: .
        run: python scripts/smoke_optimized_v1_worker.py
      - name: Configure publication identity
        run: |
          for directory in source state/publication; do
            git -C "$directory" config user.name 'github-actions[bot]'
            git -C "$directory" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          done
      - name: Solve missing released boards and publish verified paths
        working-directory: source
        env:
          PYTHONPATH: .
          GIT_TERMINAL_PROMPT: '0'
        run: python scripts/update_optimized_v1.py --state-dir "$GITHUB_WORKSPACE/state" --publish
      - name: Preserve run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimized-v1-run-${{ github.run_id }}
          path: |
            state/last-run.json
            state/receipts/*.json
          if-no-files-found: warn
          retention-days: 14
